services:
  postgres:
    image: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb   # Add this line to create 'mydb' at startup

  postgrest:
    image: postgrest/postgrest
    container_name: postgrest
    ports:
      - "3002:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:mysecretpassword@postgres:5432/mydb   # Update to use 'mydb'
      PGRST_DB_ANON_ROLE: postgres
    depends_on:
      - postgres